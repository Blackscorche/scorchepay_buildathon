name: scorchepay
description: 'ScorchePay — Money OS. Unified wallet, Smart Pay and invisible crypto in one app.'
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.8.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.2.0
  passkeys: ^2.23.1
  ndk: ^0.10.1
  ndk_flutter: ^0.10.1
  uuid: ^4.4.0
  image_picker: ^1.1.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon_source.png'
  adaptive_icon_background: '#0A0A0B'
  adaptive_icon_foreground: 'assets/adaptive_fg_red.png'
