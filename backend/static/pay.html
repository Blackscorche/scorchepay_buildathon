<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF4B1F'/%3E%3C/svg%3E">
<title>ScorchePay</title>
<style>
/*{{COMMON_CSS}}*/
.ask { color: var(--muted); font-size: 14px; }
.ask b { color: var(--text); font-weight: 650; }
.amount { font-size: 44px; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
.title { font-weight: 650; font-size: 17px; letter-spacing: -.01em; }
.meta { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.note { margin-top: 16px; padding: 12px 14px; background: var(--surface2); border-radius: var(--radius-sm); font-size: 14px; }
.note::before { content: "“"; color: var(--ember); font-weight: 800; margin-right: 2px; }
.note::after { content: "”"; color: var(--ember); font-weight: 800; margin-left: 2px; }
.qr { background: #fff; border-radius: 18px; padding: 14px; display: grid; place-items: center; aspect-ratio: 1; }
.qr img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
.sats b { font-size: 20px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.approx { color: var(--muted); font-size: 13.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.timer { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.timer.low { color: var(--ember); }
</style>
</head>
<body>
<main class="wrap" data-code="{{CODE}}">
  <div class="top">
    <div class="brand"><i></i>ScorchePay</div>
    <div class="lang"><select id="lang" aria-label="Language"></select></div>
  </div>

  <div id="loading" class="skeleton"></div>

  <section id="bill" class="card" hidden>
    <div class="ask" id="ask"></div>
    <div class="amount" id="amount"></div>
    <div class="title" id="title"></div>
    <div class="meta" id="target"></div>
    <div class="note" id="note" hidden></div>
  </section>

  <section id="start" hidden><button id="pay" data-i18n="pay">Pay with Bitcoin ⚡</button></section>

  <section id="invoice" class="card" hidden>
    <div class="qr"><img id="qr" alt="Lightning invoice QR code" width="260" height="260"></div>
    <div class="spread" style="margin: 14px 2px 12px">
      <div class="sats"><b id="sats"></b><div class="approx" id="approx"></div></div>
      <span class="timer" id="timer"></span>
    </div>
    <div class="row">
      <a class="btn" id="open" data-i18n="open_wallet">Open wallet</a>
      <button class="ghost" id="copy" data-i18n="copy">Copy invoice</button>
    </div>
  </section>

  <section id="status" class="card state" hidden>
    <div class="badge" id="badge"></div>
    <h2 id="statusTitle"></h2>
    <p id="statusText"></p>
    <div class="progress" id="steps" hidden style="margin-top:18px"><span></span><span></span><span></span></div>
  </section>

  <section id="retry" hidden><button id="again"></button></section>

  <p class="err" id="error"></p>
  <p class="fine" data-i18n="fine">Pay from any Lightning wallet. If the bill can't be delivered, the payment is cancelled and your sats go straight back to your wallet.</p>
</main>

<script>/*{{COMMON_JS}}*/</script>
<script>
(function () {
  I18N.add({
    en: {
      asked: "{name} asked you to pay a bill", pay: "Pay with Bitcoin ⚡", open_wallet: "Open wallet", copy: "Copy invoice",
      copied: "Copied ✓", copy_failed: "Copy failed", expires_in: "Expires in {t}", expired: "Expired",
      new_invoice: "Get a new invoice", try_again: "Try again",
      paid: "Bill paid", paid_text: "{title} is done. Thank you!",
      cancelled: "Request cancelled", cancelled_text: "{name} cancelled this request.",
      lapsed: "Request expired", lapsed_text: "Ask for a new link.",
      received: "Payment received", received_text: "Buying {title}… your sats are only taken once it's delivered.",
      checking: "Being checked", checking_text: "We're confirming this bill with the provider.",
      failed: "Bill couldn't be delivered", failed_text: "Your payment went back to your wallet.",
      fine: "Pay from any Lightning wallet. If the bill can't be delivered, the payment is cancelled and your sats go straight back to your wallet.",
      generic_error: "Something went wrong. Try again.",
    },
    ha: {
      asked: "Buƙatar biyan kuɗi daga {name}", pay: "Biya da Bitcoin ⚡", open_wallet: "Buɗe wallet", copy: "Kwafi invoice",
      copied: "An kwafa ✓", copy_failed: "Kwafin bai yi ba", expires_in: "Zai ƙare nan da {t}", expired: "Ya ƙare",
      new_invoice: "Samu sabon invoice", try_again: "Sake gwadawa",
      paid: "An biya kuɗin", paid_text: "An gama {title}. Na gode!",
      cancelled: "An soke buƙatar", cancelled_text: "An soke wannan buƙatar.",
      lapsed: "Buƙatar ta ƙare", lapsed_text: "Ka nemi sabon link.",
      received: "An karɓi kuɗin", received_text: "Ana sayen {title}… ba za a ɗauki sats ɗinka ba sai an kai shi.",
      checking: "Ana dubawa", checking_text: "Muna tabbatar da wannan bill da kamfanin.",
      failed: "Ba a iya kai bill ɗin ba", failed_text: "An mayar da kuɗinka cikin wallet ɗinka.",
      fine: "Ka biya daga kowane Lightning wallet. Idan ba a iya kai bill ɗin ba, za a soke biyan kuma sats ɗinka za su koma wallet ɗinka kai tsaye.",
      generic_error: "Wani abu ya faru. Sake gwadawa.",
    },
    pcm: {
      asked: "{name} ask make you pay bill", pay: "Pay with Bitcoin ⚡", open_wallet: "Open wallet", copy: "Copy invoice",
      copied: "I don copy ✓", copy_failed: "Copy no work", expires_in: "E go expire for {t}", expired: "E don expire",
      new_invoice: "Get new invoice", try_again: "Try again",
      paid: "Bill don pay", paid_text: "{title} don finish. Thank you!",
      cancelled: "Request don cancel", cancelled_text: "{name} cancel this request.",
      lapsed: "Request don expire", lapsed_text: "Ask for new link.",
      received: "We don receive your payment", received_text: "We dey buy {title}… we no go take your sats until e deliver.",
      checking: "We dey check am", checking_text: "We dey confirm this bill with the provider.",
      failed: "Bill no deliver", failed_text: "Your money don go back to your wallet.",
      fine: "Pay from any Lightning wallet. If the bill no deliver, we go cancel the payment and your sats go go back to your wallet sharp sharp.",
      generic_error: "Something happen. Try again.",
    },
  });
  var t = I18N.t;

  var code = document.querySelector("main").dataset.code;
  var api = "/v1/public/bill-links/" + code;
  var $ = function (id) { return document.getElementById(id); };
  var show = function (id, on) { $(id).hidden = on === false; };
  var link = null, poll = null, tick = null, shownInvoice = null;

  function call(path, opts) {
    return fetch(api + (path || ""), opts || {}).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (json) {
        if (!res.ok) throw new Error((json.error && json.error.message) || t("generic_error"));
        return json;
      });
    });
  }

  function status(kind, title, text, step) {
    $("badge").className = "badge " + kind;
    $("badge").innerHTML = icons[kind];
    $("statusTitle").textContent = title;
    $("statusText").textContent = text;
    show("steps", step != null);
    Array.prototype.forEach.call($("steps").children, function (s, i) { s.classList.toggle("on", step != null && i <= step); });
    show("status");
  }

  // The server's own sentences are English; in another language show ours.
  function serverText(text, fallback) { return I18N.lang === "en" && text ? text : fallback; }

  function render() {
    if (!link) return;
    show("loading", false);
    $("ask").innerHTML = "";
    var asked = t("asked", { name: "\u0000" }).split("\u0000");
    $("ask").appendChild(document.createTextNode(asked[0]));
    var b = document.createElement("b"); b.textContent = link.requester; $("ask").appendChild(b);
    $("ask").appendChild(document.createTextNode(asked[1] || ""));
    $("amount").textContent = fmt.naira(link.amount);
    $("title").textContent = link.title;
    $("target").textContent = link.target;
    $("note").textContent = link.note || "";
    show("note", !!link.note);
    show("bill");

    var p = link.payment;
    var live = p && p.status === "awaitingPayment" && new Date(p.expiresAt) > new Date();
    ["start", "invoice", "status", "retry"].forEach(function (id) { show(id, false); });

    if (link.status === "paid") { status("ok", t("paid"), serverText(p && p.message, t("paid_text", { title: link.title }))); return stop(); }
    if (link.status === "cancelled") { status("err", t("cancelled"), t("cancelled_text", { name: link.requester })); return stop(); }
    if (link.status === "expired") { status("err", t("lapsed"), t("lapsed_text")); return stop(); }
    if (p && (p.status === "paid" || p.status === "fulfilling")) {
      return status("wait", t("received"), t("received_text", { title: link.title }), p.status === "paid" ? 1 : 2);
    }
    if (p && p.status === "refundable") { status("err", t("checking"), t("checking_text")); return stop(); }
    if (live) return showInvoice(p);
    if (p && p.status === "refunded") {
      status("err", t("failed"), serverText(p.failureReason, t("failed_text")));
      $("again").textContent = t("try_again"); show("retry"); return stop();
    }
    if (p) { $("again").textContent = t("new_invoice"); show("retry"); return; }
    show("start");
  }

  function showInvoice(p) {
    if (shownInvoice !== p.invoice) {
      shownInvoice = p.invoice;
      $("qr").src = api + "/qr.svg?i=" + p.invoice.slice(-12);
      $("open").href = "lightning:" + p.invoice;
    }
    $("sats").textContent = fmt.sats(p.sats);
    $("approx").textContent = p.approx ? "≈ " + fmt.usd(p.approx.usd) + " · " + fmt.gbp(p.approx.gbp) : "";
    show("invoice");
    clearInterval(tick);
    var update = function () {
      var left = Math.max(0, Math.round((new Date(p.expiresAt) - new Date()) / 1000));
      $("timer").textContent = left ? t("expires_in", { t: Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0") }) : t("expired");
      $("timer").classList.toggle("low", left < 30);
      if (!left) { clearInterval(tick); refresh(); }
    };
    update();
    tick = setInterval(update, 1000);
    startPolling();
  }

  function startPolling() { if (!poll) poll = setInterval(refresh, 2000); }
  function stop() { clearInterval(poll); clearInterval(tick); poll = null; }

  function refresh() {
    return call().then(function (l) { link = l; $("error").textContent = ""; render(); })
      .catch(function (e) { $("error").textContent = e.message; });
  }

  function getInvoice(button) {
    button.disabled = true; $("error").textContent = "";
    call("/invoice", { method: "POST" }).then(function (l) { link = l; render(); })
      .catch(function (e) { $("error").textContent = e.message; })
      .then(function () { button.disabled = false; });
  }

  $("pay").onclick = function () { getInvoice($("pay")); };
  $("again").onclick = function () { getInvoice($("again")); };
  $("copy").onclick = function () {
    copyText(link.payment.invoice).then(function (ok) {
      $("copy").textContent = t(ok ? "copied" : "copy_failed");
      setTimeout(function () { $("copy").textContent = t("copy"); }, 1600);
    });
  };

  I18N.init(render);
  refresh().then(function () { if (link && link.status === "paying") startPolling(); });
})();
</script>
</body>
</html>
